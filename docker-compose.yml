version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shadex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shadex_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shadex-network

  # SHADEX OS Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadex-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/shadex_os?schema=public
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/packages/backend/uploads
    networks:
      - shadex-network

  # Nginx (optional - for serving frontend and proxy)
  nginx:
    image: nginx:alpine
    container_name: shadex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./packages/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - shadex-network

volumes:
  postgres_data:

networks:
  shadex-network:
    driver: bridge