services:
  - type: web
    name: shadex-crm
    env: node
    rootDir: ""
    buildCommand: npm install --legacy-peer-deps && cd packages/frontend && npm run build && cd ../backend && npm run build
    startCommand: cd packages/backend && npx prisma db push --accept-data-loss && node dist/seeds/create-admin.js && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
