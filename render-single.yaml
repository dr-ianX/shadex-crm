# Render.com Deployment Configuration - SHADEX CRM (Single SPA)
# Arquitectura simplificada: 1 servicio web con API + Frontend SPA

services:
  # PostgreSQL Database Service
  - type: pserv
    name: shadex-db
    databaseName: shadex_os
    user: shadex_user
    plan: free
    region: oregon
    postgresqlVersion: 15
    
  # Single Web Service (API + Frontend SPA)
  - type: web
    name: shadex-crm
    env: node
    plan: free
    region: oregon
    rootDirectory: packages/backend
    buildCommand: |
      cd /opt/render/project/packages/backend && npm install
      cd /opt/render/project/packages/backend && npm run build
    startCommand: |
      cd /opt/render/project/packages/backend && node dist/index.js
    publishPath: dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: shadex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /opt/render/project/packages/backend/uploads
      # Frontend configuration to point to API (use Render domain)
      - key: VITE_API_URL
        value: "http://shadex-crm.onrender.com/api/v1"
      - key: VITE_APP_NAME
        value: "SHADEX CRM"
      - key: VITE_APP_TITLE
        value: "SHADEX - Sistema de Transformaciones Arquitectónicas"
      - key: VITE_APP_DESCRIPTION
        value: "Gestión integral de proyectos arquitectónicos, clientes y garantías"
      - key: VITE_APP_LOGO
        value: "/assets/shadex-logo-512.png"