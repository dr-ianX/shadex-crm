name: Playwright tests

on:
  push:
    branches: [ main, feat/*, ci/* ]
  pull_request:
    branches: [ main ]

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd packages/frontend
          npm ci

      - name: Install backend dependencies
        run: |
          cd packages/backend
          npm ci

      - name: Generate Prisma client and push schema (sqlite for CI fallback)
        run: |
          cd packages/backend
          # Use sqlite in CI to avoid external DB if POSTGRES is not desired; keep migration step safe
          npx prisma db push --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma

      - name: Build backend
        run: |
          cd packages/backend
          npm run build

      - name: Build frontend
        run: |
          cd packages/frontend
          VITE_API_URL=http://localhost:3001 npm run build

      - name: Start backend (background)
        run: |
          cd packages/backend
          node dist/index.js &
          sleep 3

      - name: Start frontend preview (background)
        run: |
          cd packages/frontend
          npm run preview -- --port 3000 &
          sleep 3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd packages/frontend
          npx playwright test --config=playwright.config.ts --reporter=list

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/frontend/playwright-report
